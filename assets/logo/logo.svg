
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="background"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#00CFFF"/>
    </linearGradient>

    <linearGradient id="accent"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00CFFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#071A35"/>

  <!-- Gradient logo tile -->
  <rect x="40" y="40" width="432" height="432"
        rx="100" fill="url(#background)"/>

  <!-- Geometric D symbol -->
  <path d="M145 112 H264
           C365 112 405 174 405 256
           C405 338 365 400 264 400
           H145 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="34"
        stroke-linejoin="round"/>

  <!-- Inner negative space -->
  <path d="M218 183 H263
           C315 183 337 210 337 256
           C337 302 315 329 263 329
           H218 Z"
        fill="#071A35"/>

  <!-- Digital accent -->
  <circle cx="375" cy="117" r="21" fill="#FFFFFF"/>

  <path d="M344 380 L395 329"
        stroke="url(#accent)"
        stroke-width="23"
        stroke-linecap="round"/>

  <circle cx="395" cy="329" r="11" fill="#FFFFFF"/>

</svg>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050914">

    <title>404 | Page Not Found — DIPROSITE</title>
    <meta name="description" content="The page you're looking for could not be found. Return to DIPROSITE.">

    <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050914;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        .error-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 30px;
            animation: logoFloat 4s ease-in-out infinite;
        }

        .error-code {
            font-size: clamp(100px, 22vw, 220px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -12px;
            margin: 0;
            background: linear-gradient(
                120deg,
                #1677FF,
                #00CFFF,
                #ffffff,
                #1677FF
            );
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 5s linear infinite;
            filter: drop-shadow(0 0 35px rgba(0, 207, 255, .2));
        }

        .error-title {
            font-size: clamp(25px, 5vw, 42px);
            margin: 25px 0 12px;
            font-weight: 800;
        }

        .error-description {
            max-width: 480px;
            color: #94A3B8;
            font-size: 16px;
            line-height: 1.8;
            margin: 0 auto 30px;
        }

        .error-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .error-btn {
            padding: 14px 25px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: .3s ease;
        }

        .home-btn {
            color: white;
            background: linear-gradient(120deg, #1677FF, #00CFFF);
            box-shadow: 0 0 25px rgba(22, 119, 255, .25);
        }

        .home-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px rgba(0, 207, 255, .4);
        }

        .back-btn {
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .2);
            background: rgba(255, 255, 255, .04);
        }

        .back-btn:hover {
            border-color: #00CFFF;
            color: #00CFFF;
            transform: translateY(-4px);
        }

        .error-footer {
            position: absolute;
            bottom: 25px;
            color: #64748B;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .error-footer span {
            color: #00CFFF;
        }

        .error-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .15;
            pointer-events: none;
            z-index: -1;
            animation: orbFloat 10s ease-in-out infinite alternate;
        }

        .orb-one {
            background: #1677FF;
            top: 5%;
            left: -150px;
        }

        .orb-two {
            background: #00CFFF;
            right: -150px;
            bottom: 5%;
            animation-delay: -5s;
        }

        @keyframes gradientMove {
            to { background-position: 300% center; }
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes orbFloat {
            to { transform: translate(100px, -70px) scale(1.3); }
        }

        @media (max-width: 500px) {
            .error-code {
                letter-spacing: -6px;
            }

            .error-footer {
                width: 100%;
                padding: 0 10px;
                text-align: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-background" aria-hidden="true"></div>

    <div class="error-orb orb-one"></div>
    <div class="error-orb orb-two"></div>

    <main class="error-page">

        <img
            src="assets/logo/diprosite-logo.svg"
            alt="DIPROSITE Logo"
            class="error-logo"
        >

        <h1 class="error-code">404</h1>

        <h2 class="error-title">Page Not Found</h2>

        <p class="error-description">
            Oops! The page you're looking for doesn't exist,
            may have been moved, or is temporarily unavailable.
            Let's get you back on track.
        </p>

        <div class="error-buttons">

            <a href="index.html" class="error-btn home-btn">
                ← Back to Home
            </a>

            <a href="#" class="error-btn back-btn" id="goBack">
                Go Back
            </a>

        </div>

        <footer class="error-footer">
            © <span id="year"></span> DIPROSITE
            <span>•</span> TECHNOLOGY • DIGITAL • INNOVATION
        </footer>

    </main>

    <script>
        // Automatic copyright year
        document.getElementById("year").textContent =
            new Date().getFullYear();

        // Browser back button
        document.getElementById("goBack").addEventListener("click", function(e) {
            e.preventDefault();

            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        });
    </script>

    <script src="js/main.js" defer></script>

</body>
</html>

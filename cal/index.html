<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d">
  <title>DEXO3 | fx-991ES PLUS 2nd Edition Web Calculator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="icon" type="image/x-icon" href="../assest/logo/logo.svg">
</head>
<body>
  <main class="stage">
    <section class="calculator" aria-label="Scientific calculator">
      <div class="solar" aria-hidden="true"></div>
      <header class="top-brand">
        <div class="casio">CASIO</div>
        <div class="model">fx-991ES PLUS</div>
        <div class="natural">NATURAL-V.P.A.M.</div>
        <div class="edition">2nd edition</div>
      </header>

      <section class="lcd-frame" aria-label="Calculator display">
        <div class="lcd">
          <div class="lcd-status">
            <span id="status-shift"></span>
            <span id="status-alpha"></span>
            <span id="status-angle">D</span>
            <span id="status-mode">COMP</span>
            <span id="status-memory"></span>
          </div>
          <div class="lcd-content">
            <canvas id="lcd-canvas" width="384" height="112" aria-label="Dot matrix display"></canvas>
          </div>
          <div id="lcd-menu" class="lcd-menu" hidden></div>
        </div>
      </section>

      <section class="key-area">
        <div class="top-controls">
          <div class="control-group left-controls">
            <button class="round-key shift-key" data-key="SHIFT" aria-label="Shift">SHIFT</button>
            <button class="round-key alpha-key" data-key="ALPHA" aria-label="Alpha">ALPHA</button>
          </div>
          <div class="nav-pad" aria-label="Navigation">
            <button data-key="UP" aria-label="Up">▲</button>
            <button data-key="LEFT" aria-label="Left">◀</button>
            <button data-key="RIGHT" aria-label="Right">▶</button>
            <button data-key="DOWN" aria-label="Down">▼</button>
          </div>
          <div class="control-group right-controls">
            <button class="round-key" data-key="MODE">MODE</button>
            <button class="round-key" data-key="ON">ON</button>
          </div>
        </div>

        <div class="key-row">
          <button class="key" data-key="CALC"><small class="yellow">SOLVE</small>CALC</button>
          <button class="key" data-key="INTEGRAL"><small class="yellow">d/dx</small>∫</button>
          <button class="key" data-key="POWER"><small class="yellow">x!</small>x⁻¹</button>
          <button class="key" data-key="LOGBASE"><small class="yellow">∑</small>log□</button>
          <button class="key" data-key="SUM"><small class="yellow">∏</small>∑</button>
          <button class="key" data-key="SETUP"><small class="yellow">SETUP</small>SETUP</button>
        </div>
        <div class="key-row">
          <button class="key" data-key="FRACTION"><small class="yellow">□/□</small>a b/c</button>
          <button class="key" data-key="SQRT"><small class="yellow">³√</small>√</button>
          <button class="key" data-key="SQUARE"><small class="yellow">x³</small>x²</button>
          <button class="key" data-key="POWER"><small class="yellow">ⁿ√</small>xʸ</button>
          <button class="key" data-key="LOG"><small class="yellow">10ˣ</small>log</button>
          <button class="key" data-key="LN"><small class="yellow">eˣ</small>ln</button>
        </div>
        <div class="key-row">
          <button class="key" data-key="NEGATIVE"><small class="yellow">(−)</small>(−)</button>
          <button class="key" data-key="DMS"><small class="yellow">° ′ ″</small>°′″</button>
          <button class="key" data-key="HYP"><small class="yellow">Abs</small>hyp</button>
          <button class="key" data-key="SIN"><small class="yellow">sin⁻¹</small>sin</button>
          <button class="key" data-key="COS"><small class="yellow">cos⁻¹</small>cos</button>
          <button class="key" data-key="TAN"><small class="yellow">tan⁻¹</small>tan</button>
        </div>
        <div class="key-row">
          <button class="key" data-key="RECALL"><small class="yellow">STO</small>RCL</button>
          <button class="key" data-key="ENG"><small class="yellow">ENG</small>ENG</button>
          <button class="key" data-key="LPAREN">(</button>
          <button class="key" data-key="RPAREN">)</button>
          <button class="key" data-key="SDF"><small class="yellow">S⇔D</small>S⇔D</button>
          <button class="key" data-key="MPLUS"><small class="yellow">M−</small>M+</button>
        </div>

        <div class="key-row number-row">
          <button class="key number" data-key="7"><small>CONST</small>7</button>
          <button class="key number" data-key="8"><small>CONV</small>8</button>
          <button class="key number" data-key="9">9</button>
          <button class="key delete-key" data-key="DEL">DEL</button>
          <button class="key clear-key" data-key="AC">AC</button>
        </div>
        <div class="key-row number-row">
          <button class="key number" data-key="4"><small>MATRIX</small>4</button>
          <button class="key number" data-key="5"><small>VECTOR</small>5</button>
          <button class="key number" data-key="6">6</button>
          <button class="key number" data-key="MULTIPLY">×</button>
          <button class="key number" data-key="DIVIDE">÷</button>
        </div>
        <div class="key-row number-row">
          <button class="key number" data-key="1"><small>STAT</small>1</button>
          <button class="key number" data-key="2"><small>CMPLX</small>2</button>
          <button class="key number" data-key="3"><small>BASE-N</small>3</button>
          <button class="key number" data-key="PLUS">+</button>
          <button class="key number" data-key="MINUS">−</button>
        </div>
        <div class="key-row number-row">
          <button class="key number" data-key="0"><small>Rnd</small>0</button>
          <button class="key number" data-key="DOT">.</button>
          <button class="key number" data-key="EXP"><small>π</small>×10ˣ</button>
          <button class="key number" data-key="ANS">Ans</button>
          <button class="key number equals-key" data-key="EQUALS">=</button>
        </div>
      </section>
      <div id="footer-container"></div>
    </section>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/display.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="../js/footeropening.js" defer></script>
</body>
</html>
